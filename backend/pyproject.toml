[project]
name = "arcadia-backend"
version = "0.1.0"
description = "Project ARCADIA — FastAPI orchestrator, Celery dispatch, Chaos Engine, ROSbridge adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.4",
  "numpy>=1.26",
  "shapely>=2.0",
  "websockets>=13",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
