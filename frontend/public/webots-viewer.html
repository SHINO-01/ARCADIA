<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ARCADIA · Webots stream</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  webots-view{display:block;width:100%;height:100%}
  #hint{position:absolute;inset:auto 8px 8px auto;color:#a3b8aa;font-size:11px;background:rgba(11,20,16,.7);padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<webots-view id="view"></webots-view>
<div id="hint">connecting…</div>
<script type="module">
  // Official Webots web interface (matches the installed R2025a snap).
  import 'https://cyberbotics.com/wwi/R2025a/WebotsView.js';
  const url = new URLSearchParams(location.search).get('url') || 'ws://localhost:1234';
  const view = document.getElementById('view');
  const hint = document.getElementById('hint');
  const connect = () => {
    try {
      view.connect(url, 'w3d', false, undefined, undefined, undefined);
      hint.textContent = url;
    } catch (e) { hint.textContent = 'viewer error: ' + e.message; }
  };
  customElements.whenDefined('webots-view').then(connect);
  view.ondisconnect = () => { hint.textContent = 'disconnected — retrying'; setTimeout(connect, 4000); };
</script>
</body>
</html>
