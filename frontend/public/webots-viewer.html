<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><title>ARCADIA · Webots stream</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  webots-view{display:block;width:100%;height:100%}
  #hint{position:absolute;left:8px;bottom:8px;color:#a3b8aa;font-size:11px;background:rgba(11,20,16,.75);padding:4px 8px;border-radius:6px;pointer-events:none}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#e6f0e9;background:#0b1410;font-size:13px;text-align:center;padding:24px}
</style>
</head>
<body>
<webots-view id="view"></webots-view>
<div id="hint">connecting…</div>
<div id="err"></div>
<script>
  // The viewer pops native confirm()/alert() dialogs on disconnect; never block the dashboard.
  window.confirm = () => false; window.alert = () => {};
</script>
<script type="module">
  const url = new URLSearchParams(location.search).get('url') || 'ws://localhost:1234';
  const view = document.getElementById('view'), hint = document.getElementById('hint'), err = document.getElementById('err');
  let timer;
  const showErr = (m) => { err.textContent = m; err.style.display = 'flex'; };
  try {
    await import('https://cyberbotics.com/wwi/R2025a/WebotsView.js');
  } catch (e) {
    showErr('Could not load the Webots web viewer (cyberbotics.com unreachable). The 3D stream needs internet access for the viewer library once; it is cached afterwards.');
    throw e;
  }
  const connect = () => {
    err.style.display = 'none';
    try { view.connect(url, 'w3d', false, undefined, undefined, undefined); hint.textContent = url; }
    catch (e) { showErr('Viewer error: ' + e.message); }
  };
  view.ondisconnect = () => { hint.textContent = 'stream disconnected — reconnecting…'; clearTimeout(timer); timer = setTimeout(connect, 4000); };
  view.onready = () => { hint.textContent = url + ' · live'; };
  customElements.whenDefined('webots-view').then(connect);
</script>
</body>
</html>
