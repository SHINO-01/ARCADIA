# diagnostic_aggregator analyzers: one OK/WARN/ERROR rollup per robot under /arcadia/<robot>
diagnostic_aggregator:
  ros__parameters:
    path: arcadia
    pub_rate: 2.0
    analyzers:
      uav_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: uav-1
        startswith: [ 'arcadia/uav-1' ]
      ugv_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: ugv-1
        startswith: [ 'arcadia/ugv-1' ]
      agv_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: agv-1
        startswith: [ 'arcadia/agv-1' ]
