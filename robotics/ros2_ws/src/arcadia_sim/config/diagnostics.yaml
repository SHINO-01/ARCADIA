# diagnostic_aggregator analyzers: every robot gets its own OK/WARN/ERROR rollup under /arcadia/<robot>
diagnostic_aggregator:
  ros__parameters:
    path: arcadia
    pub_rate: 2.0
    analyzers:
      uav_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: uav-1
        startswith: ['arcadia/uav-1']
        remove_prefix: 'arcadia/uav-1'
        timeout: 5.0
        num_items: 5
      ugv_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: ugv-1
        startswith: ['arcadia/ugv-1']
        remove_prefix: 'arcadia/ugv-1'
        timeout: 5.0
        num_items: 5
      agv_1:
        type: diagnostic_aggregator/GenericAnalyzer
        path: agv-1
        startswith: ['arcadia/agv-1']
        remove_prefix: 'arcadia/agv-1'
        timeout: 5.0
        num_items: 5
