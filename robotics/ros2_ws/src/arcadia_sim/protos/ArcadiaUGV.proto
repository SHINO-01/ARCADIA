#VRML_SIM R2025a utf8
# ARCADIA ground vehicle: skid-steer rover built from primitives (box chassis, 4 cylinder wheels),
# GPS/IMU/gyro/accelerometer, forward LiDAR. Physics enabled so motor torque feedback is real.
# template language: javascript

PROTO ArcadiaUGV [
  field SFVec3f    translation  0 0 0.2
  field SFRotation rotation     0 0 1 0
  field SFString   name         "ugv-1"
  field SFString   customData   "seeder_ugv"
  field SFString   controller   "<extern>"
  field SFColor    color        0.96 0.77 0.32
  field SFFloat    mass         180
  field SFBool     tool         TRUE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    customData IS customData
    controller IS controller
    supervisor TRUE
    children [
      # chassis
      Shape { appearance PBRAppearance { baseColor IS color roughness 0.7 metalness 0.1 } geometry Box { size 1.1 0.6 0.32 } }
      # cabin / sensor mast
      Pose { translation 0.25 0 0.28 children [ Shape { appearance PBRAppearance { baseColor 0.1 0.12 0.11 roughness 0.9 } geometry Box { size 0.35 0.45 0.24 } } ] }
      # passive solar skin
      Pose { translation -0.2 0 0.17 children [ Shape { appearance PBRAppearance { baseColor 0.12 0.2 0.45 roughness 0.2 metalness 0.6 } geometry Box { size 0.5 0.55 0.02 } } ] }
      %< if (fields.tool.value) { >%
      # rear implement (seeder/weeder/harvester tool bar)
      Pose { translation -0.62 0 -0.05 children [ Shape { appearance PBRAppearance { baseColor 0.35 0.35 0.37 metalness 0.8 roughness 0.4 } geometry Box { size 0.12 0.7 0.08 } } ] }
      %< } >%
      GPS { name "gps" }
      InertialUnit { name "imu" }
      Gyro { name "gyro" }
      Accelerometer { name "accel" }
      Lidar {
        translation 0.5 0 0.12
        name "lidar"
        horizontalResolution 64
        fieldOfView 2.4
        numberOfLayers 1
        minRange 0.15
        maxRange 8
        noise 0.01
      }
      # wheels
      %<
        const wheels = [
          ["fl_wheel", 0.36, 0.34], ["fr_wheel", 0.36, -0.34], ["rl_wheel", -0.36, 0.34], ["rr_wheel", -0.36, -0.34]
        ];
        for (const [n, x, y] of wheels) {
      >%
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor %<= x >% %<= y >% -0.09 }
        device [ RotationalMotor { name "%<= n >%" maxVelocity 20 maxTorque 60 } PositionSensor { name "%<= n >%_sensor" } ]
        endPoint Solid {
          translation %<= x >% %<= y >% -0.09
          rotation 1 0 0 1.5708
          name "%<= n >%_solid"
          children [ Shape { appearance PBRAppearance { baseColor 0.08 0.08 0.08 roughness 1 } geometry Cylinder { radius 0.11 height 0.1 } } ]
          boundingObject Cylinder { radius 0.11 height 0.1 }
          physics Physics { density -1 mass 6 }
        }
      }
      %< } >%
    ]
    boundingObject Box { size 1.1 0.6 0.32 }
    physics Physics { density -1 mass IS mass centerOfMass [ 0 0 -0.05 ] }
  }
}
