#VRML_SIM R2025a utf8
# ARCADIA Logistics AGV: low-slung heavy tow/transport unit with tread blocks and winch arm.
# template language: javascript

PROTO ArcadiaAGV [
  field SFVec3f    translation  0 0 0.2
  field SFRotation rotation     0 0 1 0
  field SFString   name         "agv-1"
  field SFString   controller   "<extern>"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    customData "logistics_agv"
    controller IS controller
    supervisor TRUE
    children [
      Shape { appearance PBRAppearance { baseColor 0.6 0.5 0.9 roughness 0.6 metalness 0.3 } geometry Box { size 1.5 0.9 0.3 } }
      # cargo bed walls
      Pose { translation -0.3 0 0.25 children [ Shape { appearance PBRAppearance { baseColor 0.2 0.18 0.3 roughness 0.9 } geometry Box { size 0.8 0.85 0.2 } } ] }
      # winch arm
      Pose { translation 0.7 0 0.3 rotation 0 1 0 0.6 children [ Shape { appearance PBRAppearance { baseColor 0.3 0.3 0.32 metalness 0.9 } geometry Cylinder { radius 0.03 height 0.7 } } ] }
      GPS { name "gps" }
      InertialUnit { name "imu" }
      Gyro { name "gyro" }
      Accelerometer { name "accel" }
      Lidar { translation 0.75 0 0.1 name "lidar" horizontalResolution 64 fieldOfView 2.4 numberOfLayers 1 minRange 0.2 maxRange 8 }
      %<
        const wheels = [["fl_wheel", 0.5, 0.5], ["fr_wheel", 0.5, -0.5], ["rl_wheel", -0.5, 0.5], ["rr_wheel", -0.5, -0.5]];
        for (const [n, x, y] of wheels) {
      >%
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor %<= x >% %<= y >% -0.1 }
        device [ RotationalMotor { name "%<= n >%" maxVelocity 16 maxTorque 120 } PositionSensor { name "%<= n >%_sensor" } ]
        endPoint Solid {
          translation %<= x >% %<= y >% -0.1
          rotation 1 0 0 1.5708
          name "%<= n >%_solid"
          children [ Shape { appearance PBRAppearance { baseColor 0.06 0.06 0.06 roughness 1 } geometry Cylinder { radius 0.11 height 0.16 } } ]
          boundingObject Cylinder { radius 0.11 height 0.16 }
          physics Physics { density -1 mass 12 }
        }
      }
      %< } >%
    ]
    boundingObject Box { size 1.5 0.9 0.3 }
    physics Physics { density -1 mass 420 centerOfMass [ 0 0 -0.08 ] }
  }
}
